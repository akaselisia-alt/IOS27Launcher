name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LAUNCHER_SERVER: ${{ vars.LAUNCHER_SERVER || 'https://ios27launcher-1.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keeps the same signing key between builds, so a new APK installs over the old one
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build standard APK
        run: gradle assembleStandardDebug --no-daemon

      - name: Build AI APK (on-device model support)
        continue-on-error: true
        run: gradle assembleAiDebug --no-daemon

      - name: Build Store APK (separate app)
        continue-on-error: true
        run: gradle :store:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk out/IOS27Launcher.apk
          if [ -f app/build/outputs/apk/ai/debug/app-ai-debug.apk ]; then
            cp app/build/outputs/apk/ai/debug/app-ai-debug.apk out/IOS27Launcher-AI.apk
          fi
          if [ -f store/build/outputs/apk/debug/store-debug.apk ]; then
            cp store/build/outputs/apk/debug/store-debug.apk out/IOS27Store.apk
          fi
          ls -l out

      # Puts the new APKs into your own Store. Runs only when you add the STORE_ID and STORE_PASSWORD secrets.
      - name: Publish to the Store
        continue-on-error: true
        env:
          STORE_SERVER: ${{ vars.LAUNCHER_SERVER || 'https://ios27launcher-1.onrender.com' }}
          STORE_ID: ${{ secrets.STORE_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          node tools/publish-to-store.js \
            "iOS 27 Launcher|com.ios27.launcher|out/IOS27Launcher.apk|Tools|A home screen launcher with an iOS look, Control Center, Settings, assistant and lock screen." \
            "iOS 27 Store|com.ios27.store|out/IOS27Store.apk|Tools|The app store for this launcher: browse, install and sell apps."

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IOS27Launcher-apks
          path: out/*.apk

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: iOS 27 Launcher (latest build)
          body: |
            IOS27Launcher.apk = stable launcher (Android 5.0+).
            IOS27Store.apk = the separate Store app (browse, install and sell apps; needs your server).
            IOS27Launcher-AI.apk = same launcher plus on-device AI model support (Android 8.0+, bigger download).
          files: out/*.apk
