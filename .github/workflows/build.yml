name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build universal APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IOS27Launcher.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOS27Launcher-apk
          path: IOS27Launcher.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: iOS 27 Launcher (latest build)
          body: Universal APK, Android 5.0+. Download IOS27Launcher.apk below.
          files: IOS27Launcher.apk
