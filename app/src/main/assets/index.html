<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: -apple-system, system-ui, Roboto, sans-serif; color: #fff; overflow: hidden; }
  body { display: flex; flex-direction: column; background: linear-gradient(160deg, rgba(40,50,120,.55), rgba(10,10,30,.55)); }
  #clock { text-align: center; padding: 36px 0 8px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  #time { font-size: 64px; font-weight: 300; letter-spacing: -2px; }
  #date { font-size: 15px; opacity: .85; }
  #pages { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #pages::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: min-content; gap: 18px 4px; padding: 16px 12px; align-content: start; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .ico { width: 58px; height: 58px; border-radius: 14px; background: #5b6cff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .ico img { width: 100%; height: 100%; object-fit: cover; }
  .app:active .ico { transform: scale(.92); }
  .lbl { font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #dots { display: flex; justify-content: center; gap: 7px; padding: 6px 0; }
  #dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); }
  #dots i.on { background: #fff; }
  #dock { display: flex; justify-content: space-around; margin: 6px 12px 10px; padding: 12px 8px; border-radius: 28px; background: rgba(255,255,255,.22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); min-height: 84px; }
</style>
</head>
<body>
  <div id="clock"><div id="time"></div><div id="date"></div></div>
  <div id="pages"></div>
  <div id="dots"></div>
  <div id="dock"></div>

<script>
(function () {
  var PER_PAGE = 20;
  var DOCK_HINTS = [/dialer/, /messag/, /camera/, /chrome|browser/];

  function tick() {
    var d = new Date();
    document.getElementById('time').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/ ?[AP]M/i, '');
    document.getElementById('date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 20000);

  function getApps() {
    if (window.Android) { try { return JSON.parse(Android.getApps()); } catch (e) {} }
    // Browser preview fallback
    return ['Phone','Messages','Camera','Browser','Maps','Mail','Photos','Music','Clock','Notes','Files','Settings']
      .map(function (n) { return { name: n, pkg: 'demo.' + n.toLowerCase() }; });
  }

  function tile(app) {
    var el = document.createElement('div');
    el.className = 'app';
    var ico = document.createElement('div');
    ico.className = 'ico';
    ico.textContent = app.name.charAt(0).toUpperCase();
    var lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = app.name;
    el.appendChild(ico); el.appendChild(lbl);
    el.addEventListener('click', function () { if (window.Android) Android.openApp(app.pkg); });
    // Load the real icon without blocking the first paint
    if (window.Android) setTimeout(function () {
      var src = Android.getIcon(app.pkg);
      if (src) { var img = new Image(); img.src = src; ico.textContent = ''; ico.appendChild(img); }
    }, 0);
    return el;
  }

  function render() {
    var apps = getApps();
    var dockApps = [];
    DOCK_HINTS.forEach(function (re) {
      var i = apps.findIndex(function (a) { return re.test(a.pkg.toLowerCase()); });
      if (i >= 0) dockApps.push(apps.splice(i, 1)[0]);
    });

    var dock = document.getElementById('dock');
    dock.innerHTML = '';
    dockApps.forEach(function (a) { dock.appendChild(tile(a)); });
    dock.querySelectorAll('.lbl').forEach(function (l) { l.style.display = 'none'; });

    var pages = document.getElementById('pages');
    var dots = document.getElementById('dots');
    pages.innerHTML = ''; dots.innerHTML = '';
    for (var i = 0; i < apps.length; i += PER_PAGE) {
      var p = document.createElement('div');
      p.className = 'page';
      apps.slice(i, i + PER_PAGE).forEach(function (a) { p.appendChild(tile(a)); });
      pages.appendChild(p);
      dots.appendChild(document.createElement('i'));
    }
    updateDots();
  }

  function updateDots() {
    var pages = document.getElementById('pages');
    var idx = Math.round(pages.scrollLeft / Math.max(pages.clientWidth, 1));
    document.querySelectorAll('#dots i').forEach(function (d, i) { d.classList.toggle('on', i === idx); });
  }
  document.getElementById('pages').addEventListener('scroll', updateDots);

  // Called by the launcher
  window.onHome = function () { document.getElementById('pages').scrollTo({ left: 0, behavior: 'smooth' }); };
  window.onAppsChanged = render;

  render();
})();
</script>
</body>
</html>
