# Fly.io: `fly launch --no-deploy --copy-config` in this folder, `fly volumes create accounts --size 1`, then `fly deploy`.
app = "ios27-launcher-server"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "accounts"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
